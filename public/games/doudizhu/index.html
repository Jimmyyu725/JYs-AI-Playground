<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1f2b" />
    <title>Dou Dizhu 斗地主 — JYs AI Playground</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Limelight&family=ZCOOL+XiaoWei&display=swap" />
    <link rel="preload" as="image" href="/assets/rooms/doudizhu/hero-desktop.webp" media="(min-width: 761px)" />
    <link rel="preload" as="image" href="/assets/rooms/doudizhu/hero-phone.webp" media="(max-width: 760px)" />
    <link rel="stylesheet" href="/shared/kit.css" />
    <link rel="stylesheet" href="/games/doudizhu/doudizhu.css" />
  </head>
  <body>
    <div class="lane-backdrop" aria-hidden="true"></div>
    <div class="lane-lanterns" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="lane-smoke" aria-hidden="true"></div>
    <div class="bulb-pool" id="bulb-pool" aria-hidden="true"></div>
    <div class="paper-drift" id="paper-drift" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <header class="lane-bar">
      <div class="bar-left" id="bar-left">
        <h1 class="room-title"><span class="title-zh" lang="zh">斗地主</span><span class="title-en">The Landlord Room</span></h1>
      </div>
      <div class="stakes" aria-label="Stakes">
        <div class="stake"><small><span lang="zh">底</span> Bid</small><strong id="bid-value">—</strong></div>
        <div class="stake"><small><span lang="zh">炸</span> Bombs</small><strong id="bomb-value">0</strong></div>
        <div class="stake stake-multiplier" id="stake-multiplier"><small><span lang="zh">倍</span> Stake</small><strong id="multiplier-value">×1</strong></div>
      </div>
      <div class="bar-right" id="bar-right"></div>
    </header>

    <main class="lane-main">
      <section class="table" id="table" aria-label="Card table">
        <div class="seat-zone seat-left" id="seat-1"></div>
        <div class="seat-zone seat-right" id="seat-2"></div>

        <div class="table-center">
          <div class="phase-banner" id="phase-banner">
            <span class="phase-mark" id="phase-mark" lang="zh">叫</span>
            <span class="phase-copy"><strong id="phase-text">Waiting for a deal</strong><small id="phase-detail">Open the setup to seat the neighbours</small></span>
            <time class="elapsed" id="elapsed" hidden></time>
            <button class="lane-button small" id="arena-toggle" type="button" hidden>Pause arena</button>
          </div>
          <div class="bottom-cards" id="bottom-cards" aria-label="Bottom cards"></div>
          <div class="trick" id="trick" aria-live="polite"></div>
          <div class="table-notice" id="table-notice" hidden></div>
        </div>

        <div class="seat-zone seat-me" id="seat-0"></div>
      </section>

      <section class="hand-dock" id="hand-dock" hidden aria-label="Your hand">
        <div class="hand-head">
          <img class="hand-cap" id="hand-cap" src="/assets/rooms/doudizhu/landlord-badge.webp" alt="Landlord" hidden />
          <span class="hand-title" id="hand-title">Your hand</span>
          <span class="hand-role" id="hand-role"></span>
          <span class="mug mug-small" id="hand-mug"><b>0</b></span>
        </div>
        <div class="hand" id="hand"></div>
        <div class="actions">
          <div class="bid-strips" id="bid-strips" hidden>
            <button class="couplet" data-score="1" type="button"><span lang="zh">叫一分</span><small>Bid 1</small></button>
            <button class="couplet" data-score="2" type="button"><span lang="zh">叫二分</span><small>Bid 2</small></button>
            <button class="couplet" data-score="3" type="button"><span lang="zh">叫三分</span><small>Bid 3</small></button>
            <button class="couplet couplet-pass" data-score="0" type="button"><span lang="zh">不叫</span><small>Pass</small></button>
          </div>
          <div class="play-buttons" id="play-buttons" hidden>
            <button class="lane-button ghost" id="pass-button" type="button"><span lang="zh">不出</span> Pass</button>
            <button class="lane-button ghost" id="clear-button" type="button">Clear</button>
            <button class="lane-button primary" id="play-button" type="button"><span lang="zh">出牌</span> Play</button>
          </div>
          <p class="hint" id="hint"></p>
        </div>
      </section>

      <aside class="ledger" id="ledger" aria-label="Table record">
        <section class="lens" aria-live="polite">
          <header class="ledger-head">
            <span class="ledger-kicker">Model lens</span>
            <span class="live" id="live-indicator"><i></i> Idle</span>
          </header>
          <div class="lens-who" id="lens-who">No one is thinking</div>
          <p class="lens-status" id="lens-status">The room waits for the selected model. Illegal plays retry twice; API errors pause for an explicit retry.</p>
          <p class="lens-summary" id="lens-summary"></p>
          <ol class="insights" id="insights"></ol>
        </section>
        <section class="record" id="record"></section>
      </aside>
    </main>

    <script type="module" src="/games/doudizhu/doudizhu.js"></script>
  </body>
</html>
