<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a14" />
    <meta name="description" content="Texas Hold'em in a 1960s Riviera card salon, against AI characters or as an AI-vs-AI arena." />
    <title>Salon Riviera · Texas Hold'em</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Italiana&family=Noto+Serif+SC:wght@500&family=Playfair+Display:wght@700&display=swap"
    />
    <link rel="stylesheet" href="/shared/kit.css" />
    <link rel="stylesheet" href="./holdem.css" />
    <link rel="preload" as="image" href="/assets/rooms/holdem/card-back.webp" />
  </head>
  <body>
    <div class="salon-backdrop" aria-hidden="true"><i class="moonlight"></i></div>
    <div class="salon-haze" aria-hidden="true"><i></i><i></i></div>

    <svg class="suit-sprite" aria-hidden="true" focusable="false">
      <symbol id="suit-S" viewBox="0 0 24 24"><path d="M12 1.6C9.4 5.6 3 9.1 3 14a4.6 4.6 0 0 0 7.7 3.4L9.4 22.4h5.2l-1.3-5A4.6 4.6 0 0 0 21 14c0-4.9-6.4-8.4-9-12.4z" /></symbol>
      <symbol id="suit-H" viewBox="0 0 24 24"><path d="M12 21.6s-8.2-5-10-10.1C.8 7.6 3.3 3.4 7.2 3.4c2.2 0 3.7 1.2 4.8 3 1.1-1.8 2.6-3 4.8-3 3.9 0 6.4 4.2 5.2 8.1-1.8 5.1-10 10.1-10 10.1z" /></symbol>
      <symbol id="suit-D" viewBox="0 0 24 24"><path d="M12 1.4 20.4 12 12 22.6 3.6 12z" /></symbol>
      <symbol id="suit-C" viewBox="0 0 24 24"><path d="M12 1.8a4.6 4.6 0 0 0-4.2 6.5A4.6 4.6 0 1 0 10.4 16.6l-1.2 5.8h5.6l-1.2-5.8a4.6 4.6 0 1 0 2.6-8.3A4.6 4.6 0 0 0 12 1.8z" /></symbol>
    </svg>

    <header class="salon-bar">
      <div class="salon-back" id="back-slot"></div>
      <div class="salon-title">
        <h1>Salon Riviera</h1>
        <p><span>Texas Hold'em</span> <span lang="zh-Hans">德州扑克</span></p>
      </div>
      <dl class="salon-meta" aria-label="Table details">
        <div><dt>Hand</dt><dd id="hand-number">—</dd></div>
        <div><dt>Blinds</dt><dd id="blind-label">—</dd></div>
        <div class="meta-mode"><dt>Table</dt><dd id="mode-label">Closed</dd></div>
      </dl>
      <div class="salon-tools" id="tools">
        <button class="brass-button ghost ledger-toggle" id="ledger-toggle" type="button" aria-controls="ledger" aria-expanded="false">Ledger</button>
      </div>
    </header>

    <main class="salon-main">
      <section class="table-wrap" aria-label="Poker table">
        <div class="table" id="table" data-players="0">
          <div class="rail" aria-hidden="true"></div>
          <div class="felt">
            <div class="felt-print" aria-hidden="true">Riviera</div>
            <div class="board">
              <div class="board-head">
                <div class="pot-plaque" id="pot-plaque">
                  <span>Pot</span>
                  <strong id="pot-value">0</strong>
                </div>
                <p class="street-label" id="street-label">The salon is quiet.</p>
              </div>
              <div class="community" id="community" aria-label="Community cards"></div>
            </div>
          </div>
          <div class="bets" id="bets" aria-hidden="true"></div>
          <div class="seats" id="seats"></div>
        </div>
      </section>

      <section class="action-bar" id="action-bar" aria-label="Your options">
        <div class="action-context">
          <span class="eyebrow" id="context-eyebrow">Welcome</span>
          <strong id="context-title">Open the setup to take a seat</strong>
          <small id="context-copy">The house seats a random set of guests at every new table.</small>
        </div>
        <div class="action-panel" id="action-panel"></div>
      </section>

      <aside class="ledger" id="ledger" aria-label="Croupier's ledger">
        <section class="lens" id="lens" aria-live="polite">
          <header>
            <span class="eyebrow">At the table</span>
            <span class="lens-state" id="lens-state">Idle</span>
          </header>
          <div class="lens-who" id="lens-who"></div>
          <p class="lens-status" id="lens-status">No guest is deciding.</p>
          <p class="lens-text" id="lens-text"></p>
        </section>
        <div id="transcript-slot"></div>
      </aside>
    </main>

    <script type="module" src="./holdem.js"></script>
  </body>
</html>
