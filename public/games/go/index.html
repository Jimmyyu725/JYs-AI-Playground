<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1824" />
    <title>Go 围棋 — JYs AI Playground</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" />
    <link rel="preload" as="image" href="/assets/rooms/go/stone-black.png" />
    <link rel="preload" as="image" href="/assets/rooms/go/stone-white.png" />
    <link rel="stylesheet" href="/shared/kit.css" />
    <link rel="stylesheet" href="/games/go/go.css" />
  </head>
  <body class="go-room">
    <div class="room-art" aria-hidden="true"></div>
    <div class="room-light" aria-hidden="true"></div>

    <svg class="defs" aria-hidden="true" width="0" height="0">
      <filter id="steam-filter" x="-50%" y="-20%" width="200%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.08" numOctaves="2" seed="4">
          <animate attributeName="baseFrequency" dur="6s" values="0.02 0.08;0.03 0.05;0.02 0.08" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="14" />
        <feGaussianBlur stdDeviation="1.6" />
      </filter>
    </svg>

    <header class="topbar">
      <div class="topbar-left" id="topbar-left"></div>
      <div class="title-block">
        <h1><span class="title-latin">Go</span> <span class="title-cjk">围棋</span></h1>
        <p>Kyoto tea room · Chinese area scoring</p>
      </div>
      <div class="topbar-right" id="topbar-right">
        <span class="chip" id="move-chip">Move <b id="move-number">0</b></span>
        <span class="chip chip-wide" id="rules-chip">9 × 9 · komi 7.5</span>
      </div>
    </header>

    <main class="room" id="room">
      <aside class="seats" id="seats" aria-label="Players">
        <article class="seat-card" id="seat-black" data-color="black"></article>
        <article class="seat-card" id="seat-white" data-color="white"></article>
      </aside>

      <section class="table" aria-label="Go board">
        <p class="turn-line" id="turn-line" aria-live="polite"><span class="turn-stone" id="turn-stone"></span><span id="turn-text">Open a game to begin</span></p>
        <div class="goban-wrap">
          <div class="goban" id="goban" data-size="9">
            <svg class="goban-lines" id="goban-lines" aria-hidden="true"></svg>
            <div class="goban-territory" id="goban-territory" aria-hidden="true"></div>
            <div class="goban-stones" id="goban-stones" aria-hidden="true"></div>
            <div class="goban-hits" id="goban-hits" role="grid" aria-label="Go board intersections"></div>
          </div>
        </div>
        <div class="actions">
          <button class="act" id="pass-button" type="button" disabled>Pass</button>
          <button class="act act-danger" id="resign-button" type="button" disabled>Resign</button>
          <button class="act hidden" id="arena-toggle" type="button">Pause arena</button>
          <button class="act act-quiet" id="save-button" type="button" disabled>Save</button>
        </div>
      </section>

      <aside class="rail" id="rail" aria-label="Game record">
        <section class="slip hidden" id="notice" aria-live="polite"></section>
        <section class="panel reading" id="reading">
          <header><span class="kicker">Reading the board</span><span class="live" id="live-dot">Idle</span></header>
          <p class="reading-who" id="reading-who">No model request is active.</p>
          <p class="reading-text" id="reading-text">Public rationales and supported reasoning summaries appear here and stay in the record below.</p>
        </section>
        <section class="panel record" id="record"></section>
      </aside>
    </main>

    <script type="module" src="/games/go/go.js"></script>
  </body>
</html>
